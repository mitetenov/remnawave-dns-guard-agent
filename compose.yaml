name: remnawave-dns-guard-agent

services:
  agent:
    image: ${AGENT_IMAGE:-mitetenov/remnawave-dns-guard-agent:latest}
    restart: unless-stopped
    init: true
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?Set HTTPS CONTROL_PLANE_URL in .env}
      AGENT_TOKEN: ${AGENT_TOKEN:?Set the same AGENT_TOKEN as the control plane}
      AGENT_ID: ${AGENT_ID:-ru-1}
      XRAY_BIN: /usr/local/bin/xray
      CONTROL_URLS: ${CONTROL_URLS:-https://ya.ru,https://www.cloudflare.com/cdn-cgi/trace}
      PROBE_URLS: ${PROBE_URLS:-https://www.gstatic.com/generate_204,https://cp.cloudflare.com/generate_204}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
    healthcheck:
      test: ["CMD", "python", "/app/probe_agent.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "2.0"
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
