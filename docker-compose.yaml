name: remnawave-dns-guard-agent

services:
  agent:
    image: mitetenov/remnawave-dns-guard-agent:latest
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/usr/local/bin/dns-guard-agent", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "2.0"
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
